name: "短篇小说创作"
description: "从创意到定稿：叙事学家定结构与节拍 → 心理学家塑造人物 → 作者成稿 → 责任编辑审读 → 作者按意见定稿。每步只交自己那份活，成稿不再照抄中间稿。"

agents_dir: "agency-agents-zh"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  # 3000 字以上的成稿在 2048 会被截断（Claude API 连接器没有自动续写）；放大上限，再用 assert 兜底
  max_tokens: 8192
  timeout: 300000
  retry: 2

concurrency: 2

# 交付物只有定稿：导出 Word/PDF、Studio「复制/下载结果」、--compare 盲评都只取它，
# 结构 / 人物 / 审读意见是施工图，留在运行目录里可查，不混进成品
deliverables: [final_story]

inputs:
  - name: premise
    label: "故事创意"
    description: "一句话梗概 / 主题 / 想写的那个瞬间"
    required: true
    default: "修表匠收到一块永远比标准时间快七分钟的表，送修单上的名字是他三十年前失踪的父亲。"
  - name: style
    label: "风格"
    description: "选一个，或自己填（如：黑色幽默、乡土、赛博朋克）"
    required: false
    options: ["悬疑", "温情", "科幻", "荒诞", "现实主义", "武侠", "恐怖"]
    default: "悬疑"
  - name: length
    label: "字数"
    description: "目标字数；5000 以上建议分章，另起工作流"
    required: false
    options: ["800", "1500", "3000", "5000"]
    default: "1500"

steps:
  # ── 第 1 层：结构 + 节拍（只出骨架，不写成品句子）──
  - id: story_structure
    role: "academic/academic-narratologist"
    name: "叙事学家"
    task: |
      请为以下创意设计一篇约 {{length}} 字短篇小说的叙事结构和节拍表。

      创意：{{premise}}
      风格：{{style}}

      输出（markdown）：
      1. **核心冲突**：一句话
      2. **叙事视角**：人称 + 视角人物 + 是否不可靠叙述者，以及为什么这个视角最能放大冲突
      3. **叙事技巧**：选 1-2 种（倒叙 / 留白 / 反转 / 双线 / 回环等），说明用在哪一处
      4. **节拍表**：5-8 个节拍，按顺序编号。每个节拍只写四行：
         - 发生什么（一句话，事件本身）
         - 戏剧功能（揭示 / 加压 / 反转 / 释放）
         - 读者此刻知道而人物不知道的（或反之）
         - 本节拍结束时的钩子
      5. **结尾方式**：开放 / 闭合 / 回环，最后一个画面是什么意象（只写意象，不写句子）
      6. **主题**：一句话，正文里不许直说

      硬性要求：
      - 这是给作者的施工图，不是成品。**不要写任何可以直接放进小说的句子或对白**，节拍里出现引号即视为违规。
      - 只输出以上六项，不要开场白、不要"需要的话我可以…"之类的后续提议。
    output: structure

  # ── 第 2 层：人物（读过结构，人物名字与节拍对齐）──
  - id: character_design
    role: "academic/academic-psychologist"
    name: "人物设计"
    task: |
      基于以下叙事结构，设计主要人物（2-3 个）。人物必须能承担节拍表里的每一个节拍。

      {{structure}}

      每个人物输出（markdown）：
      ### 姓名（身份，年龄）
      - **一句话**：这个人是谁
      - **核心动机**：想要什么，为什么现在想要
      - **内心矛盾**：害怕什么 / 不愿面对什么——它和核心动机怎么打架
      - **说话方式**：句子长短、口头禅或回避的词、什么话题会让他沉默（给作者写对白用）
      - **记忆点**：一个具体的身体细节或习惯动作，正文里可以反复出现
      - **弧线**：从 [起点状态] → [终点状态]，转折发生在哪个节拍

      要求：
      - 人物要真实可信，避免脸谱化；配角也要有独立动机，不只是主角的功能件。
      - 给人物起具体的中文名（除非结构里已指定），不要用"他 / 妻子 / 老人"代替。
      - 只输出人物设定，不要写场景、不要写对白样例、不要提后续建议。
    output: characters
    depends_on: [story_structure]

  # ── 第 3 层：成稿 ──
  - id: write_story
    role: "marketing/marketing-content-creator"
    name: "执笔作者"
    emoji: "🖋"
    task: |
      你现在是小说作者，不是文案。根据下面的施工图，写一篇约 {{length}} 字、{{style}} 风格的短篇小说。

      ## 叙事结构与节拍表
      {{structure}}

      ## 人物设定
      {{characters}}

      写作要求：
      - 直接输出小说正文：不要标题、不要"以下是"、不要写作说明、不要结尾附注
      - 严格按节拍表推进，但节拍表只是骨架，每个节拍都要写成有环境、动作、感官细节的场景
      - 第一段就要在具体画面或动作里，不要以背景介绍、天气、人物简历开头
      - 对话口语化，按人物设定里的"说话方式"区分每个人的口吻；不允许人物互相解释彼此已知的事
      - 用具体的声音、气味、触感、物件代替形容词堆砌；每个人物的"记忆点"至少出现两次
      - 节奏：紧张处用短句，沉浸处用长句；情绪不要靠"他感到…"直接陈述，靠动作和物件
      - 主题只能通过事件和意象浮现，任何人物都不许把主题说出口
      - 结尾停在最后一个意象上，不解释、不升华、不总结
    acceptance: |
      1. 输出的是小说正文本身：没有标题、没有"以下是"之类的开场白、没有写作说明或结尾附注
      2. 正文字数在 {{length}} 字的 ±30% 范围内
      3. 第一段就是具体画面或动作，不是背景介绍
      4. 至少有一段对话，且不同人物的说话方式能区分开
      5. 结尾停在一个画面或意象上，没有解释谜底、没有点明主题
    assert:
      # 防截断兜底（约 500 个汉字）；assert 不认 {{length}}，所以按最小档写死
      min_bytes: 1500
    output: draft
    depends_on: [character_design]

  # ── 第 4 层：责任编辑审读（只给意见，不重写）──
  - id: editor_review
    role: "academic/academic-narratologist"
    name: "责任编辑"
    emoji: "🧐"
    task: |
      你现在是这篇小说的责任编辑。对照施工图审读初稿，给作者一份修改意见。

      ## 施工图
      {{structure}}

      ## 人物设定
      {{characters}}

      ## 初稿
      {{draft}}

      审读重点（按优先级）：
      1. 节拍是否都落实了？哪个节拍写虚了、跳过了或被稀释了
      2. 人物是否走样：说话方式、记忆点、弧线转折点是否与设定一致
      3. 哪些地方在"讲"而不是"演"（直接陈述情绪、人物解释已知信息、说出主题）
      4. 开头是否足够快进入画面；结尾是否多解释了一句
      5. 语言：陈词滥调、重复的句式、可以删掉的形容词

      输出格式：
      - 最多 6 条意见，按对成稿影响从大到小排序
      - 每条一行：**位置**（引用原文不超过 15 字）→ **问题** → **具体改法**（改成什么样，不是"再打磨一下"）
      - 最后一行：**保留**：列出 2-3 处写得好、定稿时不要动的地方
      - 不要重写正文，不要打分，不要客套，不要提后续建议
    output: editor_notes
    depends_on: [write_story]

  # ── 第 5 层：定稿 ──
  - id: final_story
    role: "marketing/marketing-content-creator"
    name: "执笔作者 · 定稿"
    emoji: "🖋"
    task: |
      你是这篇小说的作者。责任编辑给了修改意见，请在初稿基础上修改，交出定稿。

      ## 初稿
      {{draft}}

      ## 编辑意见
      {{editor_notes}}

      修改要求：
      - 逐条处理编辑意见；"保留"清单里的段落不动
      - 是修改不是重写：没有被指出问题的段落保持原样，不要顺手换掉好句子
      - 篇幅仍控制在约 {{length}} 字
      - 直接输出定稿正文：不要标题、不要修改说明、不要列出你改了什么
    acceptance: |
      1. 输出的是小说正文本身：没有标题、没有修改说明、没有"以下是定稿"之类的开场白
      2. 编辑意见里的每一条都能在正文中看到对应的改动
      3. 正文字数在 {{length}} 字的 ±30% 范围内
      4. 结尾停在一个画面或意象上，没有解释谜底、没有点明主题
    assert:
      min_bytes: 1500
    output: story
    depends_on: [editor_review]
