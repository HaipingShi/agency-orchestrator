name: "中篇小说·分章创作"
description: "五章固定：叙事学家出全书大纲与伏笔清单 → 心理学家写人物圣经 → 逐章执笔（每章读大纲、人物、上一章全文与「事实账本」）→ 每章后账本更新 → 全书连贯性审校。交付物只有五章正文，导出即成书稿。"
category: "内容创作"

agents_dir: "agency-agents-zh"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  max_tokens: 8192
  timeout: 300000
  retry: 2

concurrency: 2

# 交付物 = 五章正文（每章第一行自带 "## 第N章 章名"，导出时按序拼成书稿）。
# 大纲 / 人物圣经 / 账本 / 审校意见都是施工图，留在运行目录里可查、可 --feedback 返工。
deliverables: [ch1, ch2, ch3, ch4, ch5]

inputs:
  - name: premise
    label: "故事创意"
    description: "一句话梗概 / 主题 / 想写的那个世界"
    required: true
    default: "沿海小城的海关缉私队队长退休前最后一个月，发现三十年前放走的那艘船的船主，成了如今捐建整座渔港的慈善家。"
  - name: style
    label: "风格"
    description: "选一个，或自己填"
    required: false
    options: ["现实主义", "悬疑", "温情", "科幻", "武侠", "历史", "荒诞"]
    default: "现实主义"
  - name: chapter_length
    label: "每章字数"
    description: "五章合计约 5 倍；3500 字/章 ≈ 1.7 万字全书"
    required: false
    options: ["1500", "2500", "3500"]
    default: "2500"
  - name: setting
    label: "已有设定（可空）"
    description: "已经定好的人物、世界观、禁忌或必须出现的情节；没有就留空"
    required: false
    default: ""

steps:
  # ── 全书大纲 + 伏笔清单（只出骨架，不写成品句子）──
  - id: outline
    role: "academic/academic-narratologist"
    name: "叙事学家 · 全书大纲"
    task: |
      请为一部五章、每章约 {{chapter_length}} 字的{{style}}风格中篇小说设计全书大纲。

      创意：{{premise}}
      已有设定：{{setting}}

      输出（markdown）：
      1. **一句话故事**：主角 + 欲望 + 阻力 + 代价
      2. **叙事视角与时态**：人称、视角人物、是否不可靠叙述者，为什么
      3. **全书结构**：五章各自承担什么（建立 / 升级 / 中点反转 / 崩塌 / 收束），一句话一章
      4. **分章大纲**：每章一节，格式固定：
         ### 第N章 章名
         - 本章目标（读者读完这章该知道 / 该担心什么）
         - 事件（3-5 条，按顺序，只写发生了什么）
         - 转折（本章最大的一次变化）
         - 结尾钩子（章末停在哪个未决状态或画面上）
      5. **伏笔清单**：表格三列——伏笔 / 埋在第几章 / 收在第几章。至少 4 条，每条都必须收
      6. **主题**：一句话，正文里不许直说

      硬性要求：
      - 这是施工图，不是成品。**不要写任何可以直接放进小说的句子或对白**，出现引号即视为违规。
      - 只输出以上六项，不要开场白、不要"需要的话我可以…"之类的后续提议。
    output: outline

  # ── 人物圣经 ──
  - id: bible
    role: "academic/academic-psychologist"
    name: "心理学家 · 人物圣经"
    task: |
      基于全书大纲，写人物圣经（3-5 个人物）。人物必须能承担大纲里的每一个事件与转折。

      {{outline}}

      每个人物输出（markdown）：
      ### 姓名（身份，年龄）
      - **一句话**：这个人是谁
      - **核心动机**：想要什么，为什么现在想要
      - **内心矛盾**：害怕什么 / 不愿面对什么——它和核心动机怎么打架
      - **说话方式**：句子长短、口头禅或回避的词、什么话题会让他沉默（给作者写对白用）
      - **记忆点**：一个具体的身体细节或习惯动作，全书可以反复出现
      - **分章状态**：第 1 章 → 第 5 章，每章一行：他在哪、他相信什么、他和主角的关系处于什么状态

      要求：
      - 给人物起具体的中文名（除非大纲或设定里已指定），不要用"他 / 妻子 / 老人"代替。
      - 配角也要有独立动机，不只是主角的功能件。
      - 只输出人物圣经，不要写场景、不要写对白样例、不要提后续建议。
    output: bible
    depends_on: [outline]

  # ── 第一章 ──
  - id: ch1
    role: "marketing/marketing-content-creator"
    name: "第一章"
    emoji: "🖋"
    task: |
      你是这部小说的作者。按全书大纲写**第一章**，约 {{chapter_length}} 字，{{style}}风格。

      ## 全书大纲
      {{outline}}

      ## 人物圣经
      {{bible}}

      写作要求：
      - 第一行写章标题，格式严格为：`## 第一章 章名`（章名取大纲里的）。之后直接是正文，不要任何说明、附注或"以下是"
      - 只写第一章的事件，不要提前写后面章节的内容；本章埋的伏笔按伏笔清单埋，埋得自然、不加重音
      - 第一段就在具体画面或动作里，不要以背景介绍、天气、人物简历开头
      - 对话口语化，按人物圣经里的"说话方式"区分每个人的口吻；不允许人物互相解释彼此已知的事
      - 用具体的声音、气味、触感、物件代替形容词堆砌；主角的"记忆点"至少出现两次
      - 情绪不要靠"他感到…"直接陈述，靠动作和物件
      - 章末停在大纲写的结尾钩子上：不总结、不预告下一章、不升华
    acceptance: |
      1. 第一行是 "## 第一章 章名" 格式的标题，之后直接是正文，没有说明、附注或开场白
      2. 至少有一段对话，且不同人物的说话方式能区分开
      3. 第一段就是具体画面或动作，不是背景介绍
      4. 章末停在一个未决的画面或动作上，没有总结、没有预告下一章
      5. 正文里没有"上一章""本章""下一章"这类元叙述
    assert:
      min_chars: "{{chapter_length}} * 0.7"
      max_chars: "{{chapter_length}} * 1.5"
    output: ch1
    depends_on: [bible]

  # ── 账本：每章之后由叙事学家记账，下一章据此承接 ──
  - id: ledger1
    role: "academic/academic-narratologist"
    name: "账本 · 第一章后"
    emoji: "📒"
    task: |
      你是这部小说的连贯性编辑。读完第一章，建立「事实账本」，供写第二章的作者承接。

      ## 全书大纲
      {{outline}}

      ## 第一章
      {{ch1}}

      账本格式（markdown，尽量用短句，总长不超过 800 字）：
      1. **已确立的事实**：人名、地名、时间、物件、数字——正文里已经写死、后文不能变的
      2. **人物当前状态**：每人一行：在哪、知道什么、相信什么、和主角关系如何
      3. **伏笔账**：表格——伏笔 / 已埋（第几章、以什么形式）/ 待收（第几章）
      4. **章末定格**：第一章最后一个画面 / 动作 / 未决状态，原文引用不超过 30 字
      5. **下一章必须承接的**：2-4 条，写清楚"必须交代 / 不能提前揭示"

      只输出账本，不评价文笔，不给修改建议，不提后续建议。
    output: ledger1
    depends_on: [ch1]

  - id: ch2
    role: "marketing/marketing-content-creator"
    name: "第二章"
    emoji: "🖋"
    task: |
      你是这部小说的作者。按全书大纲写**第二章**，约 {{chapter_length}} 字，{{style}}风格。

      ## 全书大纲
      {{outline}}

      ## 人物圣经
      {{bible}}

      ## 事实账本（截至上一章）——正文不得与之矛盾
      {{ledger1}}

      ## 上一章全文（承接它的结尾状态与语气）
      {{ch1}}

      写作要求：
      - 第一行写章标题，格式严格为：`## 第二章 章名`。之后直接是正文，不要任何说明、附注或"以下是"
      - 开头承接账本里的"章末定格"与"下一章必须承接的"，不重述上一章已写过的事
      - 只写本章的事件；本章该埋 / 该收的伏笔按伏笔账处理
      - 对话按人物圣经的"说话方式"区分口吻；不允许人物互相解释彼此已知的事
      - 用具体的声音、气味、触感、物件代替形容词堆砌；情绪靠动作和物件，不靠"他感到…"
      - 章末停在大纲写的结尾钩子上：不总结、不预告下一章、不升华
    acceptance: |
      1. 第一行是 "## 第二章 章名" 格式的标题，之后直接是正文，没有说明、附注或开场白
      2. 至少有一段对话，且不同人物的说话方式能区分开
      3. 开头没有重述上一章已经发生的事
      4. 章末停在一个未决的画面或动作上，没有总结、没有预告下一章
      5. 正文里没有"上一章""本章""下一章"这类元叙述
    assert:
      min_chars: "{{chapter_length}} * 0.7"
      max_chars: "{{chapter_length}} * 1.5"
    output: ch2
    depends_on: [ledger1]

  - id: ledger2
    role: "academic/academic-narratologist"
    name: "账本 · 第二章后"
    emoji: "📒"
    task: |
      你是这部小说的连贯性编辑。在上一版账本基础上，读完第二章，更新「事实账本」。

      ## 全书大纲
      {{outline}}

      ## 上一版账本
      {{ledger1}}

      ## 第二章
      {{ch2}}

      更新规则：保留仍然成立的条目；新增第二章确立的事实；人物状态改成第二章末的；伏笔账标记本章已埋 / 已收；
      "章末定格"和"下一章必须承接的"全部换成第二章的。格式与上一版相同，总长不超过 1000 字。
      只输出更新后的完整账本，不评价文笔，不给修改建议，不提后续建议。
    output: ledger2
    depends_on: [ch2]

  - id: ch3
    role: "marketing/marketing-content-creator"
    name: "第三章"
    emoji: "🖋"
    task: |
      你是这部小说的作者。按全书大纲写**第三章**（中点反转所在的一章），约 {{chapter_length}} 字，{{style}}风格。

      ## 全书大纲
      {{outline}}

      ## 人物圣经
      {{bible}}

      ## 事实账本（截至上一章）——正文不得与之矛盾
      {{ledger2}}

      ## 上一章全文（承接它的结尾状态与语气）
      {{ch2}}

      写作要求：
      - 第一行写章标题，格式严格为：`## 第三章 章名`。之后直接是正文，不要任何说明、附注或"以下是"
      - 开头承接账本里的"章末定格"与"下一章必须承接的"，不重述上一章已写过的事
      - 本章的转折要靠事件发生，不靠人物突然想通；转折之前读者要能回头找到铺垫
      - 对话按人物圣经的"说话方式"区分口吻；不允许人物互相解释彼此已知的事
      - 用具体的声音、气味、触感、物件代替形容词堆砌；情绪靠动作和物件，不靠"他感到…"
      - 章末停在大纲写的结尾钩子上：不总结、不预告下一章、不升华
    acceptance: |
      1. 第一行是 "## 第三章 章名" 格式的标题，之后直接是正文，没有说明、附注或开场白
      2. 至少有一段对话，且不同人物的说话方式能区分开
      3. 开头没有重述上一章已经发生的事
      4. 章末停在一个未决的画面或动作上，没有总结、没有预告下一章
      5. 正文里没有"上一章""本章""下一章"这类元叙述
    assert:
      min_chars: "{{chapter_length}} * 0.7"
      max_chars: "{{chapter_length}} * 1.5"
    output: ch3
    depends_on: [ledger2]

  - id: ledger3
    role: "academic/academic-narratologist"
    name: "账本 · 第三章后"
    emoji: "📒"
    task: |
      你是这部小说的连贯性编辑。在上一版账本基础上，读完第三章，更新「事实账本」。

      ## 全书大纲
      {{outline}}

      ## 上一版账本
      {{ledger2}}

      ## 第三章
      {{ch3}}

      更新规则：保留仍然成立的条目；新增第三章确立的事实；人物状态改成第三章末的；伏笔账标记本章已埋 / 已收；
      "章末定格"和"下一章必须承接的"全部换成第三章的。格式与上一版相同，总长不超过 1000 字。
      只输出更新后的完整账本，不评价文笔，不给修改建议，不提后续建议。
    output: ledger3
    depends_on: [ch3]

  - id: ch4
    role: "marketing/marketing-content-creator"
    name: "第四章"
    emoji: "🖋"
    task: |
      你是这部小说的作者。按全书大纲写**第四章**（崩塌 / 最低点所在的一章），约 {{chapter_length}} 字，{{style}}风格。

      ## 全书大纲
      {{outline}}

      ## 人物圣经
      {{bible}}

      ## 事实账本（截至上一章）——正文不得与之矛盾
      {{ledger3}}

      ## 上一章全文（承接它的结尾状态与语气）
      {{ch3}}

      写作要求：
      - 第一行写章标题，格式严格为：`## 第四章 章名`。之后直接是正文，不要任何说明、附注或"以下是"
      - 开头承接账本里的"章末定格"与"下一章必须承接的"，不重述上一章已写过的事
      - 本章要把前三章埋的伏笔收掉大半（按伏笔账），收得像事件自然发生，不像作者在兑现清单
      - 对话按人物圣经的"说话方式"区分口吻；不允许人物互相解释彼此已知的事
      - 用具体的声音、气味、触感、物件代替形容词堆砌；情绪靠动作和物件，不靠"他感到…"
      - 章末停在大纲写的结尾钩子上：不总结、不预告下一章、不升华
    acceptance: |
      1. 第一行是 "## 第四章 章名" 格式的标题，之后直接是正文，没有说明、附注或开场白
      2. 至少有一段对话，且不同人物的说话方式能区分开
      3. 开头没有重述上一章已经发生的事
      4. 章末停在一个未决的画面或动作上，没有总结、没有预告下一章
      5. 正文里没有"上一章""本章""下一章"这类元叙述
    assert:
      min_chars: "{{chapter_length}} * 0.7"
      max_chars: "{{chapter_length}} * 1.5"
    output: ch4
    depends_on: [ledger3]

  - id: ledger4
    role: "academic/academic-narratologist"
    name: "账本 · 第四章后"
    emoji: "📒"
    task: |
      你是这部小说的连贯性编辑。在上一版账本基础上，读完第四章，更新「事实账本」。这是最后一章开写前的账本，
      "伏笔账"里所有仍待收的条目要单独列成一节「第五章必须收的伏笔」。

      ## 全书大纲
      {{outline}}

      ## 上一版账本
      {{ledger3}}

      ## 第四章
      {{ch4}}

      更新规则：保留仍然成立的条目；新增第四章确立的事实；人物状态改成第四章末的；伏笔账标记本章已埋 / 已收；
      "章末定格"和"下一章必须承接的"全部换成第四章的。格式与上一版相同，总长不超过 1000 字。
      只输出更新后的完整账本，不评价文笔，不给修改建议，不提后续建议。
    output: ledger4
    depends_on: [ch4]

  - id: ch5
    role: "marketing/marketing-content-creator"
    name: "第五章"
    emoji: "🖋"
    task: |
      你是这部小说的作者。按全书大纲写**第五章**（全书收束），约 {{chapter_length}} 字，{{style}}风格。

      ## 全书大纲
      {{outline}}

      ## 人物圣经
      {{bible}}

      ## 事实账本（截至上一章，含「第五章必须收的伏笔」）——正文不得与之矛盾
      {{ledger4}}

      ## 上一章全文（承接它的结尾状态与语气）
      {{ch4}}

      写作要求：
      - 第一行写章标题，格式严格为：`## 第五章 章名`。之后直接是正文，不要任何说明、附注或"以下是"
      - 开头承接账本里的"章末定格"与"下一章必须承接的"，不重述上一章已写过的事
      - 账本里「第五章必须收的伏笔」每一条都要收，收在事件里，不靠人物口头解释
      - 对话按人物圣经的"说话方式"区分口吻；不允许人物互相解释彼此已知的事
      - 用具体的声音、气味、触感、物件代替形容词堆砌；情绪靠动作和物件，不靠"他感到…"
      - 全书结尾停在最后一个意象上：主题只能浮现，任何人物都不许把主题说出口；不写后记、不写"多年以后"式的总结段
    acceptance: |
      1. 第一行是 "## 第五章 章名" 格式的标题，之后直接是正文，没有说明、附注或开场白
      2. 至少有一段对话，且不同人物的说话方式能区分开
      3. 开头没有重述上一章已经发生的事
      4. 结尾停在一个画面或意象上，没有解释谜底、没有点明主题、没有后记式总结
      5. 正文里没有"上一章""本章""下一章"这类元叙述
    assert:
      min_chars: "{{chapter_length}} * 0.7"
      max_chars: "{{chapter_length}} * 1.5"
    output: ch5
    depends_on: [ledger4]

  # ── 全书连贯性审校（只给意见；哪章有问题就 --from chN --feedback 返工那一章）──
  - id: review
    role: "academic/academic-narratologist"
    name: "连贯性审校"
    emoji: "🧐"
    task: |
      你是这部小说的责任编辑。通读五章，对照大纲、人物圣经和最后一版账本，做全书连贯性审校。

      ## 全书大纲
      {{outline}}

      ## 人物圣经
      {{bible}}

      ## 账本（第四章后）
      {{ledger4}}

      ## 第一章
      {{ch1}}

      ## 第二章
      {{ch2}}

      ## 第三章
      {{ch3}}

      ## 第四章
      {{ch4}}

      ## 第五章
      {{ch5}}

      审校重点（按优先级）：
      1. 事实矛盾：人名 / 地名 / 时间 / 物件 / 数字前后不一致
      2. 伏笔：大纲伏笔清单里哪条没埋、哪条没收、哪条收得靠人物口头解释
      3. 人物走样：说话方式、记忆点、分章状态与圣经不符；动机突然改变而没有事件支撑
      4. 章间衔接：哪一章开头重述了上一章、哪一章结尾泄了下一章
      5. 语言：全书重复出现的比喻、句式；"讲"而不是"演"的段落

      输出格式：
      - 按章分组，每章最多 4 条；每条一行：**位置**（引用原文不超过 15 字）→ **问题** → **具体改法**
      - 最后一节「**返工建议**」：列出建议返工的章及一句话意见，格式：`第N章：<意见>`
      - 没有问题的章明确写"第N章：无需返工"
      - 不要重写正文，不要打分，不要客套，不要提后续建议
    output: review_notes
    depends_on: [ch5]
